<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" height="170" role="img" aria-label="SealEcho bar preview: three glowing stack slots, a seal icon and a countdown strip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17121f"/>
      <stop offset="1" stop-color="#0d0a13"/>
    </linearGradient>

    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffd089"/>
      <stop offset="0.45" stop-color="#ff7a1a"/>
      <stop offset="1"    stop-color="#c22d12"/>
    </linearGradient>

    <linearGradient id="timefill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f22a19"/>
      <stop offset="1" stop-color="#ff9420"/>
    </linearGradient>

    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5a2a"/>
      <stop offset="1" stop-color="#2d2412"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-180%" width="220%" height="460%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-180%" width="220%" height="460%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="720" height="170" rx="14" fill="url(#bg)"/>

  <g transform="translate(40,58)">
    <rect x="-2" y="-2" width="56" height="56" rx="13" fill="#ffd98a" opacity="0.85"/>
    <rect x="0" y="0" width="52" height="52" rx="11" fill="url(#icon)"/>
    <g transform="translate(26,26)" fill="none" stroke="#f6e3a8" stroke-width="3.2" stroke-linecap="round">
      <path d="M-9,-9 L9,9 M9,-9 L-9,9"/>
    </g>
  </g>

  <g>
    <g filter="url(#glow)" opacity="0.55">
      <rect x="118" y="66" width="150" height="34" rx="17" fill="#ff7a1a"/>
      <rect x="284" y="66" width="150" height="34" rx="17" fill="#ff7a1a"/>
      <rect x="450" y="66" width="150" height="34" rx="17" fill="#ff7a1a"/>
    </g>
    <g stroke="#fff6e6" stroke-width="2.4">
      <rect x="118" y="66" width="150" height="34" rx="17" fill="url(#slot)"/>
      <rect x="284" y="66" width="150" height="34" rx="17" fill="url(#slot)"/>
      <rect x="450" y="66" width="150" height="34" rx="17" fill="url(#slot)"/>
    </g>
    <g fill="#ffffff" opacity="0.30">
      <rect x="126" y="71" width="134" height="9" rx="4.5"/>
      <rect x="292" y="71" width="134" height="9" rx="4.5"/>
      <rect x="458" y="71" width="134" height="9" rx="4.5"/>
    </g>
  </g>

  <g transform="translate(118,112)">
    <rect x="-1" y="-1" width="484" height="12" rx="6" fill="#9a9aa2" opacity="0.8"/>
    <rect x="0" y="0" width="482" height="10" rx="5" fill="#000000"/>
    <rect x="0" y="0" width="322" height="10" rx="5" fill="url(#timefill)" filter="url(#softglow)" opacity="0.65"/>
    <rect x="0" y="0" width="322" height="10" rx="5" fill="url(#timefill)"/>
  </g>

  <text x="622" y="91" font-family="Consolas,Menlo,monospace" font-size="27" font-weight="700" fill="#ff9d4d">10.1</text>

  <text x="40" y="26" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="3" fill="#8d8398">SEALECHO — 3 / 3 · SEAL OF FURY</text>
</svg>
